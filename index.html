<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Charlemos</title>
<meta name="description" content="Spanisch üben mit Claude: sprechen, hören, schreiben.">
<meta name="theme-color" content="#0B6B8A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Charlemos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: eine Bildschirmseite. Kopf oben, Gespräch scrollt, Eingabe unten fest. */
:root {
  --bg: #EDF1F3;
  --surface: #FFFFFF;
  --ink: #13222C;
  --muted: #5A6B76;
  --line: #D3DCE1;
  --accent: #0B6B8A;
  --accent-ink: #FFFFFF;
  --user: #DCEBF1;
  --warn-bg: #FFF3D6;
  --warn-ink: #5B4300;
  --live: #C2412D;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E181F; --surface: #16242D; --ink: #E6EEF2; --muted: #93A5B0; --line: #2A3C47;
    --accent: #5BC0DE; --accent-ink: #07202B; --user: #1C3441; --warn-bg: #3A2E0F; --warn-ink: #F3DCA0;
    --live: #F0806C;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-text-size-adjust: 100%;
}
.app {
  height: 100%;
  max-width: 44rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
header {
  padding-block: 12px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.6rem;
  line-height: 1.1;
  margin: 0;
  letter-spacing: -0.01em;
}
.tagline { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; }
.head-actions { display: flex; gap: 8px; }
button, select, input, textarea { font: inherit; color: inherit; }
.icon-btn {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  display: inline-grid; place-items: center;
  cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; }

/* Einstellungen */
#settings {
  max-height: 58%;
  overflow-y: auto;
  overscroll-behavior: contain;
  border-bottom: 1px solid var(--line);
  padding-block: 12px 14px;
  display: grid;
  gap: 12px;
}
.field { display: grid; gap: 4px; }
.field > span { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
.field input[type="password"], .field input[type="text"], .field select {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  font-size: 16px;
  width: 100%;
  min-width: 0;
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 12px; }
.check { display: flex; align-items: flex-start; gap: 8px; font-size: 0.95rem; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.hint { font-size: 0.85rem; color: var(--muted); margin: 0; }
.keyrow { display: flex; gap: 8px; }
.keyrow input { flex: 1; }
.btn {
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 8px;
  padding: 9px 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn.ghost { background: transparent; color: var(--accent); }

/* Gespräch */
#log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-block: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overscroll-behavior: contain;
}
.msg { max-width: 92%; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg.user { align-self: flex-end; }
.msg.bot { align-self: flex-start; }
.bubble { padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
.user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.es { font-family: var(--font-display); font-weight: 600; font-size: 1.22rem; line-height: 1.3; margin: 0; }
.es strong { color: var(--accent); font-weight: 700; }
.part-de { font-family: var(--font-body); font-weight: 400; font-size: 1.02rem; }
.part-es { color: var(--ink); }
.de { margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); }
.fix { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.fix strong { font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 0.9rem;
  cursor: pointer;
}
.chip svg { width: 16px; height: 16px; }
.chip[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.typing { display: inline-flex; gap: 5px; padding: 4px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: pulse 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
.note { color: var(--muted); font-size: 0.9rem; text-align: center; margin: 0; }
.err { color: var(--warn-ink); background: var(--warn-bg); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }

/* Eingabe */
footer {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 8px;
}
.compose { display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; min-width: 0;
  resize: none;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 16px;
  line-height: 1.35;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.round {
  flex: none;
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  display: inline-grid; place-items: center;
  cursor: pointer;
}
.round svg { width: 22px; height: 22px; }
.round.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.round.mic { width: 56px; height: 56px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.round.mic svg { width: 26px; height: 26px; }
.round.mic[aria-pressed="true"] { background: var(--live); border-color: var(--live); color: #fff; animation: ring 1.4s infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.round:disabled { opacity: .45; cursor: not-allowed; }
.miclang { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--muted); }
.miclang .chip { padding: 3px 12px; }
.status { min-height: 1.2em; margin: 0; color: var(--muted); font-size: 0.88rem; }
@media (prefers-reduced-motion: reduce) {
  .typing i, .round.mic[aria-pressed="true"] { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Charlemos</h1>
      <p class="tagline">Spanisch sprechen, hören und schreiben</p>
    </div>
    <div class="head-actions">
      <button class="icon-btn" id="newChat" type="button" aria-label="Neues Gespräch" title="Neues Gespräch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="icon-btn" id="toggleSettings" type="button" aria-label="Einstellungen" aria-expanded="false" aria-controls="settings" title="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <section id="settings" hidden aria-label="Einstellungen">
    <label class="field" for="apiKey">
      <span>API-Schlüssel (bleibt nur auf diesem Gerät)</span>
      <div class="keyrow">
        <input id="apiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…">
        <button class="btn" id="saveKey" type="button">Speichern</button>
      </div>
    </label>
    <p class="hint" id="keyState"></p>
    <div class="field">
      <span>Kurspaket oder Vokabelliste (bleibt nur auf diesem Gerät)</span>
      <div class="row">
        <input id="vocabFile" type="file" accept=".json,.txt,.csv,application/json,text/plain,text/csv" hidden>
        <button class="btn ghost" id="loadVocab" type="button">Datei laden …</button>
        <button class="btn ghost" id="resetVocab" type="button" hidden>Lernstand zurücksetzen</button>
      </div>
      <p class="hint" id="vocabState"></p>
    </div>
    <div class="field">
      <span>Lernerprofil (entsteht im Gespräch)</span>
      <p class="hint" id="profilState"></p>
      <div class="row"><button class="btn ghost" id="resetProfil" type="button" hidden>Profil löschen</button></div>
    </div>
    <div class="grid2">
      <label class="field" for="level"><span>Niveau</span>
        <select id="level">
          <option value="A1">A1 – Anfänger</option>
          <option value="A2" selected>A2 – Grundlagen</option>
          <option value="B1">B1 – Mittelstufe</option>
          <option value="B2">B2 – Fortgeschritten</option>
        </select>
      </label>
      <label class="field" for="model"><span>Modell</span>
        <select id="model">
          <option value="claude-sonnet-5-5" selected>Sonnet (empfohlen)</option>
          <option value="claude-haiku-5-5">Haiku (schneller, günstiger)</option>
        </select>
      </label>
      <label class="field" for="voice"><span>Stimme</span>
        <select id="voice"><option value="">Automatisch (Spanisch)</option></select>
      </label>
      <label class="field" for="rate"><span>Sprechtempo</span>
        <select id="rate">
          <option value="0.65">langsam</option>
          <option value="0.85" selected>ruhig</option>
          <option value="1">normal</option>
        </select>
      </label>
      <label class="field" for="micLang"><span>Mikrofon versteht</span>
        <select id="micLang">
          <option value="es-ES" selected>Spanisch</option>
          <option value="de-DE">Deutsch</option>
        </select>
      </label>
    </div>
    <label class="check" for="autoSpeak"><input type="checkbox" id="autoSpeak" checked> Antworten automatisch vorlesen</label>
    <label class="check" for="autoSend"><input type="checkbox" id="autoSend" checked> Nach dem Sprechen automatisch senden</label>
    <label class="check" for="handsFree"><input type="checkbox" id="handsFree"> Gesprächsmodus: nach jeder Antwort wieder zuhören</label>
    <button class="btn ghost" id="testVoice" type="button">Stimme testen</button>
  </section>

  <main id="log" aria-live="polite"></main>

  <footer>
    <div class="miclang">
      <span>Ich spreche:</span>
      <button class="chip" id="micLangChip" type="button" aria-label="Sprache des Mikrofons umschalten">Spanisch</button>
    </div>
    <div class="compose">
      <textarea id="input" rows="2" placeholder="Schreiben oder Mikrofon antippen" aria-label="Deine Nachricht"></textarea>
      <button class="round go" id="send" type="button" aria-label="Senden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg>
      </button>
      <button class="round mic" id="mic" type="button" aria-pressed="false" aria-label="Sprechen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <p class="status" id="status" role="status"></p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var API_URL = 'https://api.anthropic.com/v1/messages';
  var MAX_TURNS = 24;

  var $ = function (id) { return document.getElementById(id); };
  var log = $('log'), input = $('input'), sendBtn = $('send'), micBtn = $('mic'), statusEl = $('status');
  var settings = $('settings'), toggleSettings = $('toggleSettings');
  var apiKeyEl = $('apiKey'), keyState = $('keyState');
  var levelEl = $('level'), modelEl = $('model'), voiceEl = $('voice'), rateEl = $('rate'), micLangEl = $('micLang');
  var autoSpeakEl = $('autoSpeak'), autoSendEl = $('autoSend'), handsFreeEl = $('handsFree');

  var ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
  var ICON_DE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M9 6c0 5-2 8-5 10M6 11c1 2 3 4 6 5M13 20l4-10 4 10M14.5 17h5"/></svg>';


  /* ---------- Gespeicherte Einstellungen (nur auf diesem Gerät) ---------- */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('charlemos.' + k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('charlemos.' + k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem('charlemos.' + k); } catch (e) {} }
  };

  function restoreSettings() {
    levelEl.value = store.get('level', levelEl.value);
    modelEl.value = store.get('model', modelEl.value);
    rateEl.value = store.get('rate', rateEl.value);
    micLangEl.value = store.get('micLang', micLangEl.value);
    autoSpeakEl.checked = store.get('autoSpeak', '1') === '1';
    autoSendEl.checked = store.get('autoSend', '1') === '1';
    handsFreeEl.checked = store.get('handsFree', '0') === '1';
    if (!modelEl.value) modelEl.value = 'claude-sonnet-5-5';
  }
  function bindSetting(el, key, isCheck) {
    el.addEventListener('change', function () { store.set(key, isCheck ? (el.checked ? '1' : '0') : el.value); });
  }
  restoreSettings();
  bindSetting(levelEl, 'level'); bindSetting(modelEl, 'model'); bindSetting(rateEl, 'rate');
  bindSetting(micLangEl, 'micLang'); bindSetting(voiceEl, 'voice');
  // Sprache, die das Mikrofon erwartet. Claude stellt sie nach jeder Antwort passend ein; der Knopf schaltet von Hand um.
  function setMicLang(code) {
    micLangEl.value = code === 'de' ? 'de-DE' : 'es-ES';
    $('micLangChip').textContent = code === 'de' ? 'Deutsch' : 'Spanisch';
  }
  function micLangCode() { return micLangEl.value === 'de-DE' ? 'de' : 'es'; }
  setMicLang(micLangEl.value === 'de-DE' ? 'de' : 'es');
  micLangEl.addEventListener('change', function () { setMicLang(micLangCode()); });
  $('micLangChip').addEventListener('click', function () { setMicLang(micLangCode() === 'de' ? 'es' : 'de'); });
  bindSetting(autoSpeakEl, 'autoSpeak', true); bindSetting(autoSendEl, 'autoSend', true); bindSetting(handsFreeEl, 'handsFree', true);

  function getKey() { return store.get('apiKey', ''); }
  function showKeyState() {
    var k = getKey();
    keyState.textContent = k ? 'Schlüssel gespeichert (endet auf …' + k.slice(-4) + ').' : 'Noch kein Schlüssel gespeichert.';
  }
  $('saveKey').addEventListener('click', function () {
    var v = apiKeyEl.value.trim();
    if (!v) { store.del('apiKey'); showKeyState(); return; }
    store.set('apiKey', v);
    apiKeyEl.value = '';
    showKeyState();
    var note = $('keyNote');
    if (note) note.remove();
    setStatus('Schlüssel gespeichert.');
  });
  showKeyState();

  function openSettings(open) {
    settings.hidden = !open;
    toggleSettings.setAttribute('aria-expanded', String(open));
  }
  toggleSettings.addEventListener('click', function () { openSettings(settings.hidden); });

  /* ---------- Vorlesen (deutsche und spanische Stimme) ---------- */
  var synth = window.speechSynthesis || null;
  var voices = [];
  function langVoices(prefix) {
    return voices.filter(function (v) { return (v.lang || '').toLowerCase().replace('_', '-').indexOf(prefix) === 0; });
  }
  function spanishVoices() { return langVoices('es'); }
  function fillVoices() {
    try { voices = synth ? synth.getVoices() : []; } catch (e) { voices = []; }
    var saved = store.get('voice', '');
    var list = spanishVoices();
    voiceEl.innerHTML = '';
    var auto = document.createElement('option');
    auto.value = ''; auto.textContent = 'Automatisch (Spanisch)';
    voiceEl.appendChild(auto);
    list.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v.voiceURI || v.name;
      o.textContent = v.name + ' (' + v.lang + ')';
      voiceEl.appendChild(o);
    });
    voiceEl.value = saved;
    if (voiceEl.value !== saved) voiceEl.value = '';
  }
  if (synth) {
    fillVoices();
    try { synth.addEventListener('voiceschanged', fillVoices); } catch (e) { synth.onvoiceschanged = fillVoices; }
  }
  function pickVoice(lang) {
    if (lang === 'de') {
      var dl = langVoices('de');
      dl = dl.filter(function (v) { return v.localService; }).concat(dl.filter(function (v) { return !v.localService; }));
      for (var k = 0; k < dl.length; k++) if (dl[k].lang.toLowerCase().replace('_', '-') === 'de-de') return dl[k];
      return dl[0] || null;
    }
    var list = spanishVoices();
    // Auf dem Gerät gespeicherte Stimmen zuerst: Netzstimmen scheitern auf Android oft mit „synthesis-failed“.
    list = list.filter(function (v) { return v.localService; }).concat(list.filter(function (v) { return !v.localService; }));
    var want = voiceEl.value;
    if (want) {
      for (var i = 0; i < list.length; i++) if ((list[i].voiceURI || list[i].name) === want) return list[i];
    }
    for (var j = 0; j < list.length; j++) if (list[j].lang.toLowerCase().replace('_', '-') === 'es-es') return list[j];
    return list[0] || null;
  }

  var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var unlocked = false;
  function unlockAudio() {
    // Nur iOS gibt die Sprachausgabe erst nach einer Berührung frei. Auf Android würde das stören.
    if (unlocked || !synth || !IS_IOS) return;
    unlocked = true;
    try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch (e) {}
  }

  // Liest eine Folge von Teilen vor: [{sprache:'de'|'es', text}], jeder Teil mit passender Stimme.
  var speakTimer = null, watchTimer = null, speakRun = 0;
  function speakParts(parts, onDone) {
    if (!synth || !window.SpeechSynthesisUtterance) {
      setStatus('Dieser Browser kann nicht vorlesen. Öffne die App in Chrome oder Safari.');
      if (onDone) onDone();
      return;
    }
    var chunks = [];
    (parts || []).forEach(function (p) {
      var t = plain(String((p && p.text) || '')).trim();
      if (!t) return;
      (t.match(/[^.!?¡¿…]+[.!?…]*|[¡¿][^.!?]*[.!?]*/g) || [t]).forEach(function (sent) {
        sent = sent.trim();

      setStatus('Vokabeln in dieser Sitzung: ' + session.ok + ' von ' + session.n + ' gewusst.');
    }
  }

  var PROFIL_FELDER = ['ziel', 'zielregion', 'varietaet', 'niveau', 'sitzungsdauer', 'modalitaet', 'rollenspiel', 'korrektur_stil', 'sprachanteil', 'andere_sprachen'];
  function applyResult(data) {
    applyRatings(data.bewertung);
    if (data.antwort_sprache === 'de' || data.antwort_sprache === 'es') setMicLang(data.antwort_sprache);
    var L = lessonKey(data.lektion);
    if (L && kurs && kurs.einheiten.some(function (e) { return e.lektion === L; }) && L !== kursstand.lektion) {
      kursstand.lektion = L; writeJSON('kursstand', kursstand); showVocabState();
    }
    if (data.profil && typeof data.profil === 'object') {
      var ch = false;
      PROFIL_FELDER.forEach(function (f) {
        var v = data.profil[f];
        if (v != null && String(v).trim() && String(v).trim() !== 'unbekannt') { profil[f] = String(v).trim().slice(0, 200); ch = true; }
      });
      if (ch) { profil.stand = new Date().toISOString().slice(0, 10); writeJSON('profil', profil); showProfil(); }
    }
  }
  function showProfil() {
    var keys = PROFIL_FELDER.filter(function (f) { return profil[f]; });
    $('profilState').textContent = keys.length ? keys.map(function (f) { return f + ': ' + profil[f]; }).join(' · ') : 'Noch kein Profil. Es entsteht im Gespräch, wenn du das Kennenlernen möchtest.';
    $('resetProfil').hidden = !keys.length;

  /* ---------- Datei laden: Kurspaket (.json) oder Vokabelliste (.txt/.csv) ---------- */
  $('loadVocab').addEventListener('click', function () { $('vocabFile').click(); });
  $('vocabFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var txt = String(reader.result || '');
      if (/^\s*\{/.test(txt)) {
        var p = null;
        try { p = JSON.parse(txt); } catch (e) {}
        if (!p || p.format !== 'charlemos-kurs' || !Array.isArray(p.einheiten) || !Array.isArray(p.vokabeln)) {
          $('vocabState').textContent = 'Diese JSON-Datei ist kein Charlemos-Kurspaket.'; return;
        }
        var titel = (p.quelle || '').indexOf('Con gusto') !== -1 ? 'Con gusto A1' : 'Kurs';
        kurs = { titel: titel, einheiten: p.einheiten, lueckentexte: p.lueckentexte || [], grammatik: p.grammatik || [] };
        vocab = p.vokabeln.map(function (a) { return { k: String(a[0]).toLowerCase(), es: a[0], de: a[1], h: '', t: 0, l: a[2] }; });
        indexVocab();
        if (!writeJSON('kurs', kurs) || !saveVocab()) { $('vocabState').textContent = 'Das Kurspaket ist zu groß für den Speicher dieses Browsers.'; return; }
        showVocabState(); setStatus('Kurspaket geladen.');
        return;
      }
      var list = parseVocabText(txt);
      if (!list.length) { $('vocabState').textContent = 'In dieser Datei habe ich keine Vokabeln gefunden.'; return; }
      vocab = list; indexVocab();
      if (!saveVocab()) { $('vocabState').textContent = 'Die Liste ist zu groß für den Speicher dieses Browsers.'; return; }
      showVocabState(); setStatus('Vokabelliste geladen.');
    };
    reader.onerror = function () { $('vocabState').textContent = 'Die Datei ließ sich nicht lesen.'; };

  });
  function twoTap(btn, label, action) {
    var armed = null;
    btn.addEventListener('click', function () {
      if (!armed) {
        btn.textContent = 'Wirklich? Noch einmal tippen';
        armed = setTimeout(function () { armed = null; btn.textContent = label; }, 4000);

      }

    });
  }
  twoTap($('resetVocab'), 'Lernstand zurücksetzen', function () {
    cards = {}; writeJSON('fsrs', cards); session = { n: 0, ok: 0 };

  });
  twoTap($('resetProfil'), 'Profil löschen', function () {

  loadVocabStore();
  showVocabState();

  /* ---------- Gespräch mit Claude ---------- */
  var turns = [];
  var busy = false;

  function greeting() {
    var hasProfil = PROFIL_FELDER.some(function (f) { return profil[f]; });
    if (!hasProfil) {
      return { parts: [
        { sprache: 'es', text: '¡Hola!' },
        { sprache: 'de', text: 'Schön, dass du da bist. Ich bin deine Spanisch-Begleitung. Wenn du magst, stelle ich dir zuerst ein paar kurze Fragen, damit ich mich auf dich einstellen kann. Wir können aber auch gleich loslegen: plaudern, eine Lektion aus Con gusto oder Vokabeln üben. Was möchtest du?' }
      ], uebersetzung: '', korrektur: '', modus: 'gespraech' };
    }
    var tip = kursstand.lektion ? ' Zuletzt waren wir bei ' + lessonName(kursstand.lektion) + '.' : '';
    return { parts: [
      { sprache: 'es', text: '¡Hola de nuevo! ¿Qué tal?' },
      { sprache: 'de', text: 'Worauf hast du heute Lust: plaudern, Lektion, Vokabeln oder eine Frage zur Grammatik?' + tip }
    ], uebersetzung: 'Hallo, schön dich wiederzusehen! Wie geht es dir?', korrektur: '', modus: 'gespraech' };
  }

  function startConversation() {
    var g = greeting();
    turns = [{ role: 'assistant', content: JSON.stringify(compact(g)) }];
    log.innerHTML = '';
    if (!getKey()) {
      var n = el('p', 'note', 'Trage zuerst oben unter Einstellungen deinen API-Schlüssel ein.');

  function compact(d) {
    return { antwort: d.parts, uebersetzung: d.uebersetzung || '', korrektur: d.korrektur || '', modus: d.modus || '', frage_id: d.frage_id || '', lektion: d.lektion || '' };
  }

  function stufe() {
    // Niveau aus dem Profil (Kennenlernen) hat Vorrang vor der Einstellung.
    var n = (profil.niveau || levelEl.value || 'A2').toLowerCase();
    if (/b2/.test(n)) return 'B2';
    if (/b1|fortgeschritten/.test(n)) return 'B1';
    if (/a2|grundlagen/.test(n)) return 'A2';
    if (/absolut|null|phrasen|anf|a1/.test(n)) return 'A1';

  }
  function sprachRegel() {
    var s = stufe(), a = (profil.sprachanteil || '').toLowerCase();
    var base = s === 'A1'
      ? 'Der Rahmen deiner Antworten ist Deutsch. Streue spanische Wörter, Wendungen und kurze Sätze ein und übersetze jeden spanischen Satz direkt danach kurz auf Deutsch. Niemals ein ganzer spanischer Absatz ohne deutsche Brücke.'
      : 'Sprich überwiegend Spanisch in kurzen, klaren Sätzen auf Niveau ' + s + '. Erklärungen, Grammatik und Korrekturen gibst du auf Deutsch. Fülle das Feld "uebersetzung" mit der deutschen Übersetzung deiner spanischen Teile.';
    if (/mehr.?span/.test(a)) base += ' Der Lernende möchte mehr Spanisch als üblich – erhöhe den spanischen Anteil.';
    if (/mehr.?deut/.test(a)) base += ' Der Lernende möchte mehr Deutsch als üblich – erhöhe den deutschen Anteil.';

  }

  function profilText() {
    var keys = PROFIL_FELDER.filter(function (f) { return profil[f]; });
    var fehlt = ['ziel', 'zielregion', 'varietaet', 'niveau', 'sitzungsdauer', 'modalitaet', 'rollenspiel'].filter(function (f) { return !profil[f]; });
    return 'LERNERPROFIL: ' + (keys.length ? keys.map(function (f) { return f + '=' + profil[f]; }).join('; ') : 'noch leer') + '.' +
      (fehlt.length ? ' Noch offen: ' + fehlt.join(', ') + '.' : '');
  }

  function kursText() {
    if (!kurs) return 'Es ist kein Kurspaket geladen. Wünscht der Lernende eine Lektion, sag ihm, dass er unter Einstellungen das Kurspaket laden kann. ';
    var t = 'KURS: Con gusto A1. Einheiten: ' + kurs.einheiten.map(function (e) {
      var anz = vocab.filter(function (v) { return lessonKey(v.l) === e.lektion; });
      var gel = anz.filter(function (v) { return fachOf(v) >= 2; }).length;
      return e.lektion + ' = ' + e.titel + ' (' + gel + '/' + anz.length + ' Wörter gelernt)';
    }).join('; ') + '. ';
    var L = kursstand.lektion;
    var e = L && kurs.einheiten.filter(function (x) { return x.lektion === L; })[0];
    if (!e) return t + 'Es ist noch keine Lektion gewählt. ';
    var box = (e.boxen || []).map(function (b) { return b.text; }).join(' | ');
    if (box.length > 2600) box = box.slice(0, 2600) + ' …';
    var konj = (e.konjugationen || []).map(function (k) { return typeof k === 'string' ? k : JSON.stringify(k); }).join(' | ').slice(0, 900);
    var dial = (e.dialoge || []).slice(0, 2).map(function (d) { return [].concat(d).join(' / '); }).join(' || ').slice(0, 900);
    var luecken = (kurs.lueckentexte || []).map(function (x, i) { x._id = 'l' + i; return x; })
      .filter(function (x) { return String(x.einheit) === L; }).slice(0, 8)
      .map(function (x) { return x._id + ' | ' + x.satz + ' | Lösung: ' + x.loesung + ' | Hinweis: ' + (x.hinweis || ''); });
    return t + 'AKTUELLE LEKTION ' + L + ': ' + e.titel + '. Lernziele: ' + (e.lernziele || []).join('; ') + '. ' +
      (box ? 'Stoff aus dem Lehrbuch: ' + box + '. ' : '') +
      (konj ? 'Konjugationen: ' + konj + '. ' : '') +
      (dial ? 'Dialoge aus dem Buch: ' + dial + '. ' : '') +
      (luecken.length ? '\nLückentexte dieser Lektion (Lösung erst nach der Antwort des Lernenden verraten):\n' + luecken.join('\n') + '\n' : '');
  }

  function vocabText() {
    if (!vocab.length) return '';
    var practice = practiceSet(12), known = knownSet(6);
    return '\nVOKABELN zum Üben (id | spanisch | deutsch | Hinweis | Lektion | Fach 0–5, 0 = neu):\n' + practice.map(vocabLine).join('\n') +
      (known.length ? '\nSchon gelernt (zum Einstreuen):\n' + known.map(vocabLine).join('\n') : '') + '\n';
  }

  function systemPrompt() {
    return [
      'Du bist eine warmherzige, geduldige Spanischlehrerin und Gesprächspartnerin für einen deutschsprachigen Erwachsenen. Du duzt ihn.',
      'GRUNDSATZ: Der Lernende bestimmt, was gemacht wird. Du darfst und sollst Vorschläge machen – zum Beispiel die nächste Lektion, eine Wiederholung, eine Übung oder das Kennenlernen –, aber du setzt sie nur um, wenn er zustimmt oder selbst etwas wählt. Sein Wunsch geht immer vor deinem Plan. Biete bei offenen Situationen zwei, drei Möglichkeiten an und lass ihn wählen.',
      'RÜCKMELDUNG HAT VORRANG: Sagt er etwas wie „zu schnell“, „zu schwer“, „anders erklären“, „Pause“, „genug für heute“ oder „lieber was anderes“, reagierst du zuerst darauf: bestätige kurz, was du verstanden hast, und handle danach. Ist die Rückmeldung mehrdeutig, frag kurz nach.',
      'SPRACHE: ' + sprachRegel(),
      'MÖGLICHKEITEN, jeweils nur auf Wunsch des Lernenden:',
      '– Plaudern: natürliches Alltagsgespräch, am Ende eine einfache Rückfrage.',
      '– Kennenlernen: Stelle die Fragen zum Profil (Ziel, Zielregion, Varietät europäisch/lateinamerikanisch/neutral, Niveau, Zeit pro Sitzung, Lieblingsform lesen/hören/sprechen/schreiben/gemischt, Offenheit für Rollenspiele, Korrekturstil sanft/direkt) – eine Frage pro Antwort. Trage nur Werte ins Feld "profil" ein, die er selbst gesagt hat. Einen schon gespeicherten Wert änderst du nur, wenn er es ausdrücklich möchte oder zugestimmt hat. Am Ende fasst du das Profil in einem Satz zusammen und fragst, ob es passt.',
      '– Kurs: eine Lektion aus Con gusto in kleinen Schritten – Lernziele nennen, Wörter, Grammatik, Dialog, Lückentext, kleine Szene. Immer nur ein Schritt pro Antwort, dann fragst du, ob er weiter will. Wählt er eine Lektion, trägst du deren Kennung (B oder 1–12) ins Feld "lektion" ein. Im Kurs bleibst du beim A1-Stoff des Buchs; liegt eine Frage darüber, sag das freundlich und nenne den passenden A1-Vorläufer.',
      '– Erklären (Zweitlehrerin): Versteht er etwas nicht, erkläre es anders als das Buch. Wähle einen Blickwinkel und nenne ihn am Anfang: Analogie zum Deutschen, Gegenbeispiel, Schritt für Schritt, Beispielreihe, Anwendungsszene, Merksatz/Eselsbrücke oder Verweis auf eine spätere Lektion. Biete am Ende einen anderen Blickwinkel an. Höchstens fünf Sätze.',
      '– Vokabeln üben: Frage pro Antwort genau ein Wort aus „VOKABELN zum Üben“ ab, meist „¿Cómo se dice «deutsches Wort»?“, ab und zu umgekehrt. Bewerte seine nächste Antwort großzügig (fehlender Artikel oder Akzent, offensichtlicher Erkennungsfehler oder gleichwertiges Wort gilt als richtig; falsches Geschlecht nur erwähnen) mit einer Note im Feld "bewertung": 1 = nicht gewusst oder falsch, 2 = mit Mühe oder Hilfe, 3 = richtig, 4 = sofort und sicher. Danach kurz Rückmeldung, richtiges Wort, bei Bedarf ein sehr kurzer Beispielsatz und gleich das nächste Wort – bis er etwas anderes möchte.',
      '– Lückentext: Stelle einen Satz aus der Liste der aktuellen Lektion, warte auf seine Antwort, verrate die Lösung erst danach und erkläre sie kurz mit dem Hinweis.',
      'Im normalen Gespräch streust du gelegentlich, höchstens ein bis zwei pro Antwort, Wörter aus „Schon gelernt“ ein. Wörter aus seiner Liste markierst du mit doppelten Sternchen, z. B. **la tarta**. Sonst keine Formatierung.',
      'KORREKTUR: ' + ((profil.korrektur_stil || '').indexOf('direkt') !== -1 ? 'direkt und knapp.' : 'sanft und ermutigend („Fast! Es heißt …“).') + ' Seine Nachrichten stammen oft aus einer Spracherkennung: ignoriere fehlende Satzzeichen und Großschreibung, deute verstümmelte deutsche Sätze wohlwollend und korrigiere nur echte sprachliche Fehler (im Feld "korrektur", auf Deutsch).',
      'GRENZEN: Halte dich kurz – höchstens zwei kurze Absätze, eine Frage oder Aufgabe pro Antwort. Erfinde keine Fakten; Datum, Uhrzeit, Wetter oder Nachrichten kannst du hier nicht nachsehen – sag das ehrlich.',
      profilText(),
      kursText(),
      vocabText(),
      'ANTWORTFORMAT: ausschließlich ein JSON-Objekt, ohne Codeblock und ohne Text davor oder danach:',
      '{"antwort":[{"sprache":"de" oder "es","text":"..."}, ...], "uebersetzung":"deutsche Übersetzung der spanischen Teile oder leer", "korrektur":"kurz auf Deutsch oder leer", "modus":"gespraech|kennenlernen|kurs|erklaeren|vokabeln|lueckentext", "frage_id":"id des gerade abgefragten Wortes oder leer", "bewertung":[{"id":"v12","note":3}] oder [], "lektion":"B, 1–12 oder leer", "profil":{"feld":"wert"} oder {}, "antwort_sprache":"de oder es"}',
      '"antwort_sprache" ist die Sprache, in der der Lernende vermutlich als Nächstes antwortet – danach richtet sich seine Spracherkennung. Fragst du auf Deutsch etwas, das er auf Deutsch beantworten wird (Kennenlernen, Wünsche, Rückfragen), dann "de". Erwartest du eine spanische Antwort (Vokabel auf Spanisch, Lückentext, Gespräch auf Spanisch), dann "es".',
      'Teile "antwort" so auf, dass jeder Teil nur eine Sprache enthält: Jeder deutsche Satz kommt in einen Teil mit "sprache":"de", jeder spanische Satz in einen Teil mit "sprache":"es" – sie werden mit einer deutschen bzw. spanischen Stimme vorgelesen. Einzelne spanische Wörter mitten in einem deutschen Satz dürfen im deutschen Teil bleiben. Erlaubte Profilfelder: ' + PROFIL_FELDER.join(', ') + '.'
    ].join('\n');
  }

  function buildMessages() {
    var list = turns.slice(-MAX_TURNS);
    while (list.length && list[0].role !== 'user') list.shift();
    if (list.length) {
      list = list.slice();
      list[0] = { role: 'user', content: '(Du hast das Gespräch begonnen mit: ' + turns[0].content + ')\n\n' + list[0].content };
    }
    return list;
  }

  function parseReply(text) {
    if (!text) return null;
    var t = String(text).trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
    var start = t.indexOf('{'), end = t.lastIndexOf('}');
    if (start !== -1 && end > start) {
      try {
        var v = JSON.parse(t.slice(start, end + 1));
        var parts = [];
        if (Array.isArray(v.antwort)) {
          v.antwort.forEach(function (p) {
            if (p && p.text) parts.push({ sprache: p.sprache === 'es' ? 'es' : 'de', text: String(p.text) });
          });
        } else if (v.es) {
          parts.push({ sprache: 'es', text: String(v.es) });
        }
        if (parts.length) return {
          parts: parts, uebersetzung: String(v.uebersetzung || v.de || ''), korrektur: String(v.korrektur || ''),
          modus: String(v.modus || ''), frage_id: String(v.frage_id || ''),
          bewertung: Array.isArray(v.bewertung) ? v.bewertung : [], lektion: String(v.lektion || ''),
          antwort_sprache: String(v.antwort_sprache || ''),
          profil: v.profil && typeof v.profil === 'object' ? v.profil : {}
        };
      } catch (e) {}
    }
    return t ? { parts: [{ sprache: 'de', text: t }], uebersetzung: '', korrektur: '' } : null;
  }

  function explainError(status, body) {
    var msg = (body && body.error && body.error.message) || '';
    if (status === 401) return 'Der API-Schlüssel wurde abgelehnt. Prüfe ihn in den Einstellungen.';
    if (status === 403) return 'Dieser Schlüssel darf das gewählte Modell nicht nutzen. Wähle in den Einstellungen ein anderes Modell.';
    if (status === 404) return 'Das gewählte Modell ist nicht verfügbar. Wähle in den Einstellungen ein anderes Modell.';
    if (status === 429) return 'Gerade zu viele Anfragen. Warte einen Moment und sende noch einmal.';
    if (status === 529 || status === 503) return 'Claude ist gerade überlastet. Versuch es gleich noch einmal.';
    if (/credit balance/i.test(msg)) return 'Das API-Guthaben ist aufgebraucht oder noch nicht verknüpft. Prüfe in claude.ai unter Einstellungen > Abrechnung die API-Credits.';
    return 'Die Antwort hat nicht geklappt' + (msg ? ': ' + msg : '.');
  }

  async function ask() {
    var res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': getKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: modelEl.value || 'claude-sonnet-5-5',
        max_tokens: 1000,
        system: systemPrompt(),
        messages: buildMessages()
      })
    });
    var body = null;
    try { body = await res.json(); } catch (e) {}
    if (!res.ok) { var err = new Error(explainError(res.status, body)); err.status = res.status; throw err; }
    var text = '';
    if (body && Array.isArray(body.content)) {
      body.content.forEach(function (c) { if (c.type === 'text') text += c.text; });
    }
    return parseReply(text);
  }

  async function send() {
    var text = input.value.trim();
    if (!text || busy) return;
    unlockAudio();
    if (!getKey()) { openSettings(true); setStatus('Trage zuerst deinen API-Schlüssel ein.'); apiKeyEl.focus(); return; }
    stopListening(true);
    busy = true;
    sendBtn.disabled = true;
    input.value = '';
    setStatus('');
    turns.push({ role: 'user', content: text });
    addUser(text);
    var pending = addPending();
    try {
      var data = await ask();
      pending.remove();
      if (!data) throw new Error('Die Antwort war leer. Schick deine Nachricht bitte noch einmal.');
      turns.push({ role: 'assistant', content: JSON.stringify(compact(data)) });
      applyResult(data);
      addBot(data);
      if (autoSpeakEl.checked) {
        speakParts(data.parts, function () { if (handsFreeEl.checked) startListening(); });
      } else if (handsFreeEl.checked) {
        startListening();
      }
    } catch (e) {
      pending.remove();
      turns.pop();
      var m = (e && e.message) || '';
      if (e instanceof TypeError || /fetch|network|load failed/i.test(m)) m = 'Keine Verbindung zu Claude. Prüfe die Internetverbindung.';
      addError(m || 'Die Antwort hat nicht geklappt.');
      input.value = text;
    } finally {
      busy = false;
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });

  /* ---------- Spracheingabe ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, finalText = '', cancelled = false;

  function stopListening(silent) {
    cancelled = !!silent;
    if (rec && listening) { try { rec.stop(); } catch (e) {} }
    listening = false;
    micBtn.setAttribute('aria-pressed', 'false');
  }

  function startListening() {
    if (busy) return;
    if (!SR) {
      setStatus('Dieser Browser hat keine Spracheingabe. Nutze Chrome (Android) oder Safari (iPhone), oder das Mikrofon der Tastatur.');
      return;
    }
    if (synth) { try { synth.cancel(); } catch (e) {} }
    try {
      rec = new SR();
      rec.lang = micLangEl.value;
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      var base = input.value.trim() ? input.value.trim() + ' ' : '';
      finalText = '';
      cancelled = false;
      rec.onresult = function (ev) {
        var interim = '', fin = '';
        for (var i = 0; i < ev.results.length; i++) {
          if (ev.results[i].isFinal) fin += ev.results[i][0].transcript;
          else interim += ev.results[i][0].transcript;
        }
        finalText = fin;
        input.value = base + fin + interim;
      };
      rec.onerror = function (ev) {
        listening = false;
        micBtn.setAttribute('aria-pressed', 'false');
        if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
          setStatus('Das Mikrofon ist nicht freigegeben. Erlaube es in den Browser-Einstellungen für diese Seite.');
        } else if (ev.error === 'no-speech') {
          setStatus('Ich habe nichts gehört. Tippe aufs Mikrofon und sprich noch einmal.');
        } else if (ev.error === 'aborted') {
          setStatus('');
        } else if (ev.error === 'network') {
          setStatus('Die Spracherkennung braucht eine Internetverbindung.');
        } else {
          setStatus('Spracheingabe hat nicht geklappt (' + ev.error + ').');
        }
      };
      rec.onend = function () {
        listening = false;
        micBtn.setAttribute('aria-pressed', 'false');
        if (statusEl.textContent === 'Ich höre zu …') setStatus('');
        if (!cancelled && autoSendEl.checked && input.value.trim() && finalText.trim()) send();
      };
      rec.start();
      listening = true;
      micBtn.setAttribute('aria-pressed', 'true');
      setStatus('Ich höre zu …');
    } catch (e) {
      listening = false;
      micBtn.setAttribute('aria-pressed', 'false');
      setStatus('Spracheingabe startet hier nicht. Tippe noch einmal aufs Mikrofon.');
    }
  }

  micBtn.addEventListener('click', function () {
    unlockAudio();
    if (listening) { stopListening(false); }
    else startListening();
  });

  $('newChat').addEventListener('click', function () {
    stopListening(true);
    if (synth) { try { synth.cancel(); } catch (e) {} }
    setStatus('');
    startConversation();
  });

  startConversation();
})();
</script>
</body>
</html>
